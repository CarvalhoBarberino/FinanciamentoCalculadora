<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=2.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<link rel="stylesheet" href="estilos.css">
		<title>Exemplo 2.1</title>
	</head>
	<body>
		<img src="balança.jpg" alt="imagem de uma balaça">
		<h1>Programa de Cálculo de peso ideal</h1>
		<p>
			Nome: <input type="text" id="inNome">
		</p>
		<p>
			Sexo: 
			<input type="radio" name="sexo" id="rbMasculino"> Masculino
			<input type="radio" name="sexo" id="rbFeminino"> Feminino
		</p>
		<p>
			Altura: <input type="text" id="inAltura">
		</p>
		<p>
			<input type="button" value="Calcular" id="btCalcular">
			<input type="button" value="Limpar" id="btLimpar">
		</p>
		<h3 id="outResposta">

		</h3>
		<script src="funcoes.js"></script>
	</body>
</html>
